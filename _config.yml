  avatar           : "profile.png"
  name             : "Junteng Liu"
  pronouns         : # example: "she/her"  
  bio              : "First-year PhD candidate in Computer Science at the Hong Kong University of Science and Technology, a member of the HKUST NLP Group advised by Professor Junxian He. His research focuses on natural language processing and machine learning, with interests in LLM reasoning and reinforcement learning, hallucination in vision-language models, and LLM truthfulness and interpretability."
  location         : # example: "San Francisco, CA"
  employer         : "HKUST NLP Group"
  uri              : # URL
  email            : "jliugi@connect.ust.hk" 

